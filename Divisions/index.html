<html lang="ca"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dividim · Dues xifres</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fb;color:#20314c;font-family:Verdana,sans-serif}main{max-width:1100px;margin:35px auto;padding:20px}h1{font-size:34px;letter-spacing:-1px;margin:8px 0}p{line-height:1.65}.tag{color:#54706a;font-size:12px;font-weight:bold;letter-spacing:2px}header{margin-bottom:25px}.card{background:white;border:1px solid #dce3ef;border-radius:22px;padding:25px;margin-bottom:18px;box-shadow:0 8px 30px #23345306}.controls{display:flex;gap:14px;flex-wrap:wrap;align-items:end}label{font-size:13px;display:block;margin-bottom:7px}select,button,input{font:inherit;border-radius:9px;border:1px solid #b9c7d9;padding:11px;background:white;color:inherit}button{cursor:pointer;font-size:14px;font-weight:bold}button:hover{background:#eef3fc}button.primary{background:#285bd6;color:white;border-color:#285bd6}button.soft{background:#e9f6f0;border-color:#b5d9c8}input{width:100px;text-align:center}input:focus{outline:3px solid #abc6ff}#workspace{display:grid;grid-template-columns:1fr 340px;gap:18px}.scroll{overflow:auto;padding:12px 0}.division{display:grid;grid-template-columns:auto 250px;width:max-content;margin:15px auto;align-items:start}.left{padding:8px 14px 8px 5px}.right{border-left:3px solid #20314c;min-height:140px}.divisor{padding:8px 15px;border-bottom:3px solid #20314c}.quotient{padding:16px;display:flex;gap:5px;flex-wrap:wrap}.digits{display:flex;position:relative;min-height:45px;justify-content:flex-end}.digit{position:relative;width:43px;height:45px;display:inline-flex;align-items:center;justify-content:center;font-family:Cambria,Georgia,serif;font-size:32px;border-radius:6px;padding:0;border:none;background:transparent;flex:none}.digit input{width:39px;height:42px;padding:0;font:inherit;border-radius:5px}.digit.active{background:#ffe0a1;color:#6a4200}.digit.selected{background:#d4e6ff}.row{border-bottom:2px solid #b9c7d9}.res{color:#216654}.minus{position:absolute;left:-14px;top:7px;font-size:26px}.q{font:30px Cambria;min-width:29px;display:inline-block;text-align:center}.pill{display:inline-block;padding:7px 12px;border-radius:30px;background:#edf1f8;font-size:12px;margin:4px}.step{font-size:20px;margin:8px 0 18px;line-height:1.5}.hint{color:#5d6e86;font-size:13px}.math{font-family:Cambria,Georgia,serif;font-size:24px;text-align:center;margin:18px 0}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}.choices{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.choices button.chosen{background:#ffd78c}.field{margin:12px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}#toast{position:fixed;top:25px;left:50%;transform:translateX(-50%);z-index:20;background:#20314c;color:white;padding:18px 25px;border-radius:14px;max-width:90%;box-shadow:0 10px 40px #0003;display:none}.error{outline:3px solid #e66b62;border-radius:8px}.success{color:#17614e}.small{font-size:12px}footer{font-size:12px;color:#6c7b90;margin-top:20px}@media(max-width:850px){#workspace{grid-template-columns:1fr}.digit{width:36px}.division{grid-template-columns:auto 190px}main{margin:10px auto;padding:12px}.card{padding:18px}}
.operand-d{color:#245ed2;background:#e5eeff;border-radius:6px}.operand-q{color:#137752;background:#def5e9;border-radius:6px}.subtraction{position:relative;width:max-content;margin-left:auto}.subtraction .digits .digit:not(:empty){border-bottom:2px solid #708198;border-radius:0}.subtraction .digits .digit:empty{visibility:hidden}.subtraction:before{content:none}.subtraction .digits .digit:first-of-type{position:relative}.minus{left:-24px}.divisor.product-focus .digit{background:#e5eeff;color:#245ed2}.q.product-focus{background:#def5e9;color:#137752}.product-boxes{display:flex;justify-content:center;gap:7px;margin:18px 0}.product-digit{width:48px;height:54px;font:30px Cambria;padding:4px}.vertical-subtraction{width:max-content;margin:20px auto;font:30px Cambria}.vertical-subtraction>div{display:flex;position:relative;justify-content:flex-end}.vertical-subtraction span,.vertical-subtraction input{width:48px;height:50px;display:inline-flex;align-items:center;justify-content:center;padding:0;font:30px Cambria;white-space:pre}.vertical-subtraction .subtrahend{border-bottom:2px solid #20314c;margin-bottom:9px}.subtrahend b{position:absolute;left:-24px;top:7px}.zero-note{background:#eef4ff;padding:14px;border-radius:12px}.lower-source{animation:sourcePulse 1.6s ease}.lower-target{animation:lowerDigit 1.6s ease}@keyframes sourcePulse{0%,60%{background:#ffe09a}100%{background:transparent}}@keyframes lowerDigit{0%{transform:translateY(-55px);opacity:0;background:#ffe09a}50%{transform:translateY(0);opacity:1;background:#ffe09a}100%{background:transparent}}@media(prefers-reduced-motion:reduce){.lower-source,.lower-target{animation:none;background:#ffe09a}}</style>
<main><header><div class="tag">LABORATORI DEL CÀLCUL</div><h1>Dividim, pas a pas.</h1><p>Divisions entre dues xifres · Entén cada pas i comprova el resultat.</p></header>
<section class="card controls"><div><label for="mode">Com vols dividir?</label><select id="mode"><option value="written">Escrivint la resta</option><option value="mental">Sense escriure la resta intermèdia</option></select></div><div><label for="level">Nivell d’ajuda</label><select id="level"><option value="guided">Guiat</option><option value="reduced">Amb menys pistes</option><option value="auto">Autònom</option><option value="master">Màster</option></select></div><div><label for="length">Xifres del dividend</label><select id="length"><option value="random">Entre 4 i 6</option><option>4</option><option>5</option><option>6</option></select></div><div><label for="practice">Tipus de pràctica</label><select id="practice"><option value="all">Divisions variades</option><option value="zeros">Zeros dins del quocient</option></select></div><button class="primary" id="new">Nova divisió</button></section>
<div id="workspace"><section class="card"><div><span id="badge" class="pill"></span><span id="progress" class="pill"></span></div><div class="scroll" id="board"></div><p class="hint" id="boardhint"></p></section><section class="card" id="panel"></section></div><footer>Els intents formen part de l’aprenentatge. Pots provar una xifra i rectificar-la.</footer></main><div id="toast" role="status" aria-live="polite"></div>
<script>window.MathJax={tex:{inlineMath:[["\\(","\\)"]]},startup:{typeset:false}};</script><script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
<script>
const $=s=>document.querySelector(s);let S,timer;
function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';clearTimeout(timer);timer=setTimeout(()=>$('#toast').style.display='none',5500)}
function rand(a,b){return a+Math.floor(Math.random()*(b-a+1))}
function start(n,d){let len=$('#length').value==='random'?rand(4,6):+$('#length').value;S={n:n||rand(10**(len-1),10**len-1),d:d||rand(10,99),mode:$('#mode').value,level:$('#level').value,stage:'select',selected:0,rows:[],q:'',carry:0,col:0};if(!n&&$('#practice').value==='zeros'){let attempts=0;while(!String(Math.floor(S.n/S.d)).slice(1,-1).includes('0')&&attempts++<2000){S.n=rand(10**(len-1),10**len-1);S.d=rand(10,99)}}S.str=String(S.n);render()}
function digits(v,end,cls='',editable=false,id=''){let a=String(v),out='';for(let i=0;i<S.str.length;i++){let j=i-(end-a.length+1);out+=`<span class="digit ${cls}">${j>=0&&j<a.length?(editable?`<input inputmode="numeric" maxlength="1" aria-label="${id}, columna ${i+1}" data-group="${id}" value="${a[j]==='_'?'':a[j]}">`:a[j]):''}</span>`}if(cls==='subtract')out=out.replace(/(<span class="digit subtract">)(?=[^<]|<input)/,'$1<span class="minus">−</span>');return `<div class="digits">${out}</div>`}
function board(){let top='<div class="digits">';for(let i=0;i<S.str.length;i++)top+=`<button class="digit ${S.stage==='select'&&i<S.selected?'selected':''} ${S.level==='guided'&&S.stage!=='select'&&i<=S.end&&i>S.end-String(S.p).length&&(!['mulcol','target','subcol','topcol'].includes(S.stage)||(S.col===0?i===S.end:i<S.end))?'active':''}" onclick="selectPrefix(${i+1})" aria-label="Selecciona les primeres ${i+1} xifres">${S.str[i]}</button>`;top+='</div>';let rows=S.rows.map((r,i)=>`<div id="row${i}">${S.mode==='written'?'<div class="subtraction">'+digits(r.product,r.end,'subtract')+' </div>':''}${digits(i<S.rows.length-1?S.rows[i+1].p:(i===S.rows.length-1&&!['finish','verify','done','error'].includes(S.stage)?S.p:r.r),i<S.rows.length-1?S.rows[i+1].end:(i===S.rows.length-1&&!['finish','verify','done','error'].includes(S.stage)?S.end:r.end),'res')}</div>`).join('');let current='';if(S.stage!=='select'&&S.stage!=='finish'&&S.stage!=='verify'&&S.stage!=='done'){if(S.mode==='written'&&S.product!==undefined)current+='<div class="subtraction">'+digits(S.product,S.end,'subtract')+'</div>';if(S.stage==='free'){if(S.mode==='written')current+='<div class="subtraction">'+digits('_'.repeat(String(S.p).length),S.end,'subtract',true,'product')+'</div>';current+=digits('_'.repeat(String(S.p).length),S.end,'res',true,'remainder')}else if(S.resdigits)current+=digits(S.resdigits,S.end,'res')}
$('#board').innerHTML=`<div class="division"><div class="left">${top}${rows}${current}</div><div class="right"><div class="divisor ${S.stage==='product'?'product-focus':''}"><span class="digit ${S.level==='guided'&&(!['mulcol','target','subcol','topcol'].includes(S.stage)||S.col===1)?'active':''}">${Math.floor(S.d/10)}</span><span class="digit ${S.level==='guided'&&(!['mulcol','target','subcol','topcol'].includes(S.stage)||S.col===0)?'active':''}">${S.d%10}</span></div><div class="quotient">${S.q.split('').map(x=>'<span class="q">'+x+'</span>').join('')}${S.candidate!==undefined&&!['finish','verify','done','error'].includes(S.stage)?'<span class="q selected '+(S.stage==='product'?'product-focus':'')+'">'+S.candidate+'</span>':''}</div></div></div>`;
$('#badge').textContent=({guided:'Guiat',reduced:'Amb menys pistes',auto:'Autònom',master:'Màster'})[S.level];$('#progress').textContent=S.stage==='select'?'Preparem la divisió':S.stage==='done'?'Divisió acabada':`Xifres baixades: ${Math.min(S.end+1,S.str.length)} / ${S.str.length}`;$('#boardhint').textContent=S.stage==='select'?'Clica l’última xifra del grup que vols marcar, començant per l’esquerra.':S.stage==='free'?'Escriu el producte de dreta a esquerra. Les unitats queden alineades a la dreta; pots deixar buides les caselles inicials del producte.':S.level==='master'?'En mode màster, revisarem tots els passos al final.':''}
function subtractionBoxes(){let width=String(S.p).length;return '<div class="vertical-subtraction"><div>'+String(S.p).split('').map(d=>'<span>'+d+'</span>').join('')+'</div><div class="subtrahend"><b>−</b>'+String(S.product).padStart(width,' ').split('').map(d=>'<span>'+d+'</span>').join('')+'</div><div>'+Array.from({length:width},(_,i)=>'<input data-group="guided-remainder" inputmode="numeric" maxlength="1" aria-label="Residu, columna '+(i+1)+'">').join('')+'</div></div>'}
function retryDivision(){start(S.n,S.d)}
function retryLess(){let levels=['guided','reduced','auto','master'];$('#level').value=levels[Math.min(3,levels.indexOf(S.level)+1)];start(S.n,S.d)}
function animateLowered(){let source=document.querySelector('.left > .digits').children[S.end];source?.classList.add('lower-source');let row=document.querySelector('#row'+(S.rows.length-1)+' > .digits:last-child');row?.children[S.end]?.classList.add('lower-target')}
function selectPrefix(k){if(S.stage!=='select')return;S.selected=k;render()}
function field(label,id='answer'){return `<label for="${id}">${label}</label><input id="${id}" inputmode="numeric" autocomplete="off">`}
function action(label,fn,primary=true){return `<button class="${primary?'primary':''}" onclick="${fn}">${label}</button>`}
function render(){board();let h='',st=S.stage,guided=S.level==='guided',instant=guided||S.level==='reduced';if(st==='select')h='<div class="step">Marca les primeres xifres.</div><p>El divisor té dues xifres. Agafa’n dues; si el nombre és més petit que el divisor, agafa’n tres.</p>'+action('Començar','begin()');
if(st==='candidate'){let prefix=String(S.p).length>2?Math.floor(S.p/10):Math.floor(S.p/10);h='<div class="step">Tria una xifra del quocient.</div>'+(guided&&S.p<S.d?'<p class="zero-note">Aquest nombre és més petit que el divisor. Escriu un <b>0 al quocient</b> en aquesta posició: no podem formar cap grup complet. Després podrem baixar la següent xifra.</p>':guided?`<p>Per quin nombre pots multiplicar <b>${Math.floor(S.d/10)}</b> per obtenir <b>${prefix}</b> o menys?</p><p class="hint">És una estimació: després comprovarem el candidat. La xifra ha d’estar entre 0 i 9.</p>`:'')+field('Xifra del quocient')+action('Provar aquesta xifra','candidate()')}
if(st==='product')h='<div class="step">Calcula el producte.</div>'+`<div class="math"><span class="operand-d">${S.d}</span> × <span class="operand-q">${S.candidate}</span></div>`+'<p class="hint">Escriu el producte <b>de dreta a esquerra</b>, començant per les unitats. Pots deixar buides les caselles inicials que no necessitis.</p><div class="product-boxes">'+Array.from({length:3},(_,i)=>'<input class="product-digit" data-group="guided-product" inputmode="numeric" maxlength="1" aria-label="'+['Centenes','Desenes','Unitats'][i]+'">').join('')+'</div>'+action('Comprovar el producte','product()')+change();
if(st==='remainder')h='<div class="step">Ara fes la resta.</div><p class="hint">Escriu el residu <b>de dreta a esquerra</b>. Comença per les unitats.</p>'+subtractionBoxes()+action('Comprovar la resta','remainder()')+change();
if(st==='mulcol'){let dd=S.col===0?S.d%10:Math.floor(S.d/10);h='<div class="step">'+(S.col===0?'Comença per les unitats.':'Continua amb les desenes.')+'</div>'+`<div class="math"><mark>${S.candidate}</mark> × <mark>${dd}</mark>${S.col?' + '+S.carry:''}</div>`+field(S.col?'Producte més les que en duus':'Resultat del producte')+action('Continuar','mulcol()')+change()}
if(st==='target'){let digit=Number(String(S.p).at(-1-S.col));h='<div class="step">Prepara la resta.</div>'+`<p>Hem de restar <b>${S.m}</b> a un nombre acabat en <b>${digit}</b>. Quin és el primer que ens permet fer-ho?</p><div class="choices">${Array.from({length:4},(_,i)=>digit+10*Math.max(0,Math.ceil((S.m-digit)/10)-1+i)).map(v=>action(v,`target(${v})`,false)).join('')}</div>`+change()}
if(st==='subcol')h='<div class="step">Resta i indica les que en duus.</div>'+`<div class="math">${S.target} − ${S.m}</div>`+field('Xifra del residu')+'<label>Quantes en duus?</label><div class="choices">'+Array.from({length:10},(_,i)=>`<button class="${S.pick===i?'chosen':''}" onclick="pickCarry(${i})">${i===0?'0':'+'+i}</button>`).join('')+'</div>'+action('Continuar','subcol()')+change();
if(st==='topcol')h='<div class="step">Acaba la resta.</div>'+`<div class="math">${Math.floor(S.p/10)} − ${S.m}</div>`+field('Part esquerra del residu')+action('Comprovar la resta','topcol()')+change();
if(st==='free'){h='<div class="step">Completa aquest pas.</div>'+`<p>Dividend parcial: <b>${S.p}</b></p>`+field('Xifra del quocient','qd');if(S.mode==='mental')h+='<p class="hint">De dreta a esquerra, escriu el producte més les que en duus, i les noves que en duus. Escriu el residu a les caselles de la divisió.</p>'+Array.from({length:2},(_,i)=>`<div class="field">${field(i?'Desenes: producte + portades':'Unitats: producte','m'+i)}${i===0?field('En duim','carry'):''}</div>`).join('');h+='<div class="actions">'+action(S.end===S.str.length-1?(S.level==='master'?'Acabar la divisió':'Comprovar aquest pas'):(S.level==='master'?'Desar i baixar la següent xifra':'Comprovar i baixar la següent xifra'),'freeStep()')+'</div>'}
if(st==='review')h='<div class="step">Està tot bé?</div><p>El residu parcial és <b>'+S.pending.r+'</b>. Compara’l amb el divisor <b>'+S.d+'</b>.</p><div class="actions">'+action(S.end===S.str.length-1?'Sí, la divisió està acabada':'Sí, continua i baixa el '+S.str[S.end+1],'continueDivision()')+action('No, el residu és massa gran','rejectRemainder()',false)+'</div>';
if(st==='overshot')h='<div class="step">El candidat és massa gran.</div><p>No podem fer aquesta resta.</p>'+action('Ens hem passat: canviem la xifra del quocient per una de menor','nextStage()');
if(st==='finish')h='<div class="step">Ja has acabat la divisió!</div><p>Vols fer la comprovació de la divisió?</p><div class="actions">'+action('Sí, fem-la!','verifyStart()')+action('Ara no','skipVerify()',false)+'</div>';
if(st==='verify'){let q=S.q,r=S.rows.at(-1).r;h='<div class="step">Comprova la divisió.</div>';if(guided)h+=`<p>Multiplica el divisor <b>${S.d}</b> pel quocient <b>${q}</b>. Després suma-hi el residu <b>${r}</b>.</p>`;else if(S.level==='reduced')h+='<div class="math">divisor × quocient + residu = dividend</div>';else h+='<p>Escriu les operacions i els resultats. Decideix si la comprovació confirma la divisió.</p><label for="expression">Operacions de comprovació</label><input id="expression" style="width:100%" placeholder="Escriu la multiplicació i la suma">';h+=field('Resultat de la multiplicació','vp')+field('Resultat després de sumar el residu','vs');if(!instant)h+='<div class="choices"><button id="yes" onclick="judgment(true)">Està bé</button><button id="no" onclick="judgment(false)">Està malament</button></div>';h+=action('Acabar la comprovació','verifyEnd()')}
if(st==='done')h=`<div class="step success">${S.checked?'Comprovació correcta!':'Divisió completada!'}</div><div class="math">${S.n} ÷ ${S.d} = ${S.q}</div><p>Residu: <b>${S.rows.at(-1).r}</b></p>`+'<div class="actions">'+action('Torna a provar aquesta divisió','retryDivision()',false)+action('Repeteix-la amb menys ajuda','retryLess()',false)+action('Una altra divisió','start()')+'</div>';
if(st==='error')h='<div class="step">Revisem la primera errada.</div><p>'+S.error+'</p><p class="hint">Conservarem els passos anteriors que estan bé.</p>'+action('Reprendre des d’aquest pas','resume()');$('#panel').innerHTML=h;if(window.MathJax?.typesetPromise)document.querySelectorAll('.math').forEach(el=>{if(!el.querySelector('mark,.operand-d'))el.innerHTML='\\('+el.textContent.replaceAll('×','\\times ').replaceAll('÷','\\div ')+'\\)'});if(window.MathJax?.typesetPromise)window.MathJax.typesetPromise().catch(()=>{});$('#panel input')?.focus();setupProductInputs();$('#panel input')?.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.target.dataset.group)$('#panel button.primary')?.click()})}
function read(id='answer'){let el=$('#'+id);if(!el||!/^\d+$/.test(el.value.trim())){toast('Escriu un nombre enter positiu o zero.');return null}return Number(el.value)}
function begin(){let expected=Number(S.str.slice(0,2))>=S.d?2:3;if(S.level!=='master'&&S.selected!==expected){toast('Agafa dues xifres; si formen un nombre més petit que el divisor, agafa’n tres.');return}if(S.selected<2||S.selected>3){toast('Selecciona dues o tres xifres inicials.');return}S.initial=S.selected;S.end=S.selected-1;S.p=Number(S.str.slice(0,S.selected));nextStage()}
function nextStage(){delete S.candidate;delete S.product;S.carry=0;S.col=0;S.resdigits='';S.stage=['auto','master'].includes(S.level)?'free':'candidate';render()}
function candidate(){let q=read();if(q===null)return;if(q>9){toast('Cada candidat és una sola xifra, del 0 al 9.');return}S.candidate=q;S.stage=S.mode==='written'?'product':S.level==='guided'?'mulcol':'free';render();if(S.mode==='mental'&&S.level==='reduced')$('#qd').value=q}
function change(){return '<div class="actions">'+action('Canvia la xifra del quocient','nextStage()',false)+'</div>'}
function tooBig(){if(S.mode==='mental'){toast(`Has de provar un nombre més petit. Aconsellem ${Math.max(0,S.candidate-1)}.`);S.stage='overshot';render();return}toast(`Has de provar un nombre més petit. Aconsellem ${Math.max(0,S.candidate-1)}.`);S.stage='candidate';delete S.product;S.resdigits='';render()}
function product(){let v=readProduct('guided-product');if(v===null)return;if(v!==S.candidate*S.d){toast('Revisa la multiplicació.');return}S.product=v;if(v>S.p){tooBig();return}S.stage='remainder';render()}
function remainder(){let r=readProduct('guided-remainder');if(r===null)return;if(r!==S.p-S.product){toast('Revisa la resta.');return}accept(r)}
function accept(r,extra={},confirmed=false){if(S.level==='guided'||S.level==='reduced'){if(!confirmed){S.pending={r,extra};S.resdigits=String(r);S.stage='review';render();return}}if(r>=S.d&&S.level!=='master'){toast('El residu no és més petit que el divisor. Has de provar un nombre més gran!');nextStage();return}S.rows.push({p:S.p,end:S.end,q:S.candidate,product:S.product??S.candidate*S.d,r,...extra});S.q+=String(S.candidate);if(S.end===S.str.length-1){S.stage=S.level==='master'?'verify':'finish';render();return}S.end++;S.p=r*10+Number(S.str[S.end]);nextStage();animateLowered()}
function continueDivision(){if(S.pending.r>=S.d){toast('El residu no és més petit que el divisor. Has de provar un nombre més gran!');return}let v=S.pending;delete S.pending;accept(v.r,v.extra,true)}
function rejectRemainder(){if(S.pending.r<S.d){toast('Aquest residu sí que és més petit que el divisor. Podem continuar.');return}toast('Has de provar un nombre més gran!');delete S.pending;nextStage()}
function mulcol(){let m=read();if(m===null)return;let expected=S.candidate*(S.col?Math.floor(S.d/10):S.d%10)+(S.col?S.carry:0);if(m!==expected){toast('Revisa el producte i les que en duus.');return}S.m=m;if(S.col){if(m>Math.floor(S.p/10)){tooBig();return}S.stage='topcol'}else S.stage='target';render()}
function target(t){let digit=S.p%10,expected=digit+10*Math.max(0,Math.ceil((S.m-digit)/10));if(t!==expected){toast('Busca el primer nombre que acabi igual i que permeti restar.');return}S.target=t;S.pick=undefined;S.stage='subcol';render()}
function pickCarry(v){S.pick=v;let a=$('#answer').value;render();$('#answer').value=a}
function subcol(){let r=read();if(r===null)return;let c=Math.floor(S.target/10);if(r!==S.target-S.m||S.pick!==c){toast('Revisa la resta i les que en duus.');return}S.resdigits=String(r);S.carry=c;S.col=1;S.stage='mulcol';render()}
function topcol(){let r=read();if(r===null)return;if(r!==Math.floor(S.p/10)-S.m){toast('Revisa aquesta resta.');return}accept(r*10+Number(S.resdigits))}
function readProduct(id){let a=[...document.querySelectorAll(`[data-group="${id}"]`)];let raw=a.map(x=>x.value||' ').join('');if(!/^ *\d+$/.test(raw)){toast('Escriu el nombre de dreta a esquerra, sense deixar buits entre les xifres.');return null}return Number(raw.trim())}
function setupProductInputs(){for(let id of ['guided-product','product','guided-remainder','remainder']){let inputs=[...document.querySelectorAll(`[data-group="${id}"]`)];inputs.forEach((input,i)=>{input.addEventListener('input',()=>{input.value=input.value.replace(/[^0-9]/g,'').slice(-1);if(input.value&&i>0){inputs[i-1].focus();inputs[i-1].select()}});input.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'&&i>0){e.preventDefault();inputs[i-1].focus()}if((e.key==='ArrowRight'||(e.key==='Backspace'&&!input.value))&&i<inputs.length-1){e.preventDefault();inputs[i+1].focus()}if(e.key==='Enter'){e.preventDefault();document.querySelector('#panel button.primary')?.click()}})});if(inputs.length)inputs.at(-1).focus()}}
function group(id){let a=[...document.querySelectorAll(`[data-group="${id}"]`)];if(a.some(x=>!/^\d$/.test(x.value))){toast('Omple cada casella amb una xifra, inclosos els zeros inicials.');return null}return Number(a.map(x=>x.value).join(''))}
function freeStep(){let q=read('qd');if(q===null)return;if(q>9){toast('La xifra del quocient ha d’estar entre 0 i 9.');return}let r=readProduct('remainder');if(r===null)return;let p=S.mode==='written'?readProduct('product'):q*S.d;if(p===null)return;let extra={};if(S.mode==='mental'){extra.m0=read('m0');extra.m1=read('m1');extra.carry=read('carry');if(Object.values(extra).includes(null))return}S.candidate=q;S.product=p;let row={p:S.p,end:S.end,q,product:p,r,...extra};if(S.level!=='master'){let error=checkRow(row);if(error){toast(error);return}}accept(r,extra)}
function checkRow(r){if(r.product!==r.q*S.d)return 'Revisa la multiplicació del divisor per la xifra del quocient.';if(S.mode==='mental'){if(r.m0!==r.q*(S.d%10))return 'Revisa el producte de les unitats.';let c=Math.max(0,Math.ceil((r.m0-r.p%10)/10));if(r.carry!==c)return 'Revisa les que en duus després de restar les unitats.';if(r.m1!==r.q*Math.floor(S.d/10)+c)return 'Revisa el producte de les desenes més les que en duus.'}if(r.q*S.d>r.p)return 'El candidat és massa gran. Has de provar un nombre més petit.';if(r.r!==r.p-r.q*S.d)return 'Revisa el residu parcial: la resta no és correcta.';if(r.r>=S.d)return 'El residu no és més petit que el divisor. Has de provar un nombre més gran!';return ''}
function verifyStart(){S.stage='verify';render()}
function skipVerify(){S.stage='done';render()}
function judgment(v){S.judge=v;$('#yes').classList.toggle('chosen',v);$('#no').classList.toggle('chosen',!v)}
function firstError(){let exp=Number(S.str.slice(0,2))>=S.d?2:3;if(S.initial!==exp)return {i:0,msg:'La selecció inicial no és correcta. Cal agafar '+exp+' xifres.'};for(let i=0;i<S.rows.length;i++){let msg=checkRow(S.rows[i]);if(msg)return {i,msg}}return null}
function verifyEnd(){let p=read('vp'),s=read('vs');if(p===null||s===null)return;let actual=Number(S.q)*S.d+S.rows.at(-1).r;if(['auto','master'].includes(S.level)){if(!$('#expression').value.trim()){toast('Escriu les operacions de comprovació.');return}if(S.judge===undefined){toast('Indica si la comprovació està bé o malament.');return}}if(S.level==='master'){let err=firstError();if(err){S.errorIndex=err.i;S.error=err.msg;S.stage='error';render();$('#row'+err.i)?.classList.add('error');return}}if(p!==Number(S.q)*S.d||s!==p+S.rows.at(-1).r){toast('Revisa la multiplicació i la suma de la comprovació.');return}if(['auto','master'].includes(S.level)&&S.judge!==(actual===S.n)){toast('Revisa la teva conclusió: compara el resultat amb el dividend.');return}if(actual!==S.n){toast('La comprovació no coincideix amb el dividend.');return}S.checked=true;S.stage='done';render()}
function resume(){let i=S.errorIndex,exp=Number(S.str.slice(0,2))>=S.d?2:3;if(S.initial!==exp){S.rows=[];S.q='';S.stage='select';S.selected=0;render();return}let row=S.rows[i];S.rows=S.rows.slice(0,i);S.q=S.rows.map(r=>r.q).join('');S.p=row.p;S.end=row.end;delete S.judge;nextStage()}
$('#new').onclick=()=>start();$('#mode').onchange=()=>start();$('#level').onchange=()=>start();$('#practice').onchange=()=>start();start();
</script></html>
