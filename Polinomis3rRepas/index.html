function ask(text,action){$('dialogText').innerHTML=text;$('modal').showModal();$('cancelDialog').onclick=()=>$('modal').close();$('acceptDialog').onclick=()=>{$('modal').close();action()}}
function home(){if(mode==='exam'&&!finished){ask('<h2>Torna a l’inici?</h2><p>La prova queda guardada en aquest dispositiu i la podràs reprendre.</p>',()=>{save();landing()})}else landing()}
function landing(){mode='';let resumable=false;try{let s=JSON.parse(localStorage.getItem('polinomis-repas-v1'));resumable=s?.mode==='exam'&&!s.finished}catch{}$('app').innerHTML=`<div class="panel"><span class="badge">Prepara el teu examen</span><h2 style="margin-top:16px">Què vols practicar avui?</h2><p class="muted">Tria un tema per entendre’l millor o posa’t a prova amb un examen nou.</p><div class="grid"><button class="mode" onclick="categorySetup()"><span class="icon">▦</span><strong>Separa per categories</strong><span class="muted">Tria els temes i el nivell. Correcció i desenvolupament després de cada pregunta.</span></button><button class="mode" onclick="examIntro()"><span class="icon">✎</span><strong>Mode examen</strong><span class="muted">8 preguntes en ordre aleatori. Pots revisar les respostes abans de finalitzar.</span></button></div>${resumable?'<div class="actions"><button onclick="resume()">Reprèn la prova guardada →</button></div>':''}</div><p class="tiny muted">Treballa els passos en paper o al bloc de notes. Escriu aquí les respostes finals. La nota és orientativa perquè el procediment del paper també compta a l’examen real.</p>`}
function resume(){try{let s=JSON.parse(localStorage.getItem('polinomis-repas-v1'));({mode,questions,index,answers,hints,notes,finished,difficulty,selected,subtype}=s);render()}catch{landing()}}
function categorySetup(){mode='setup';$('app').innerHTML=`<div class="panel"><span class="badge">Repàs per categories</span><h2 style="margin-top:12px">Tria què vols reforçar</h2><p class="muted">El nivell mitjà correspon al Word modificat.</p><div class="tabs" role="tablist" aria-label="Dificultat">${['Fàcil','Mitjà','Difícil'].map((s,i)=>`<button role="tab" aria-selected="${difficulty===i}" class="${difficulty===i?'active':''}" onclick="difficulty=${i};categorySetup()">${s}</button>`).join('')}</div><div class="categories">${cats.map(([id,name])=>`<label><input type="checkbox" ${selected.includes(id)?'checked':''} onchange="toggleCategory('${id}',this.checked)">${name}</label>`).join('')}</div><div class="field"><label>Operacions amb polinomis <select id="sub" onchange="subtype=this.value"><option value="mix">Barreja d’operacions</option><option value="suma">Suma</option><option value="resta">Resta</option><option value="monomi">Multiplicació per monomi</option><option value="producte">Multiplicació per polinomi</option><option value="combinades">Operacions combinades</option></select></label></div><div class="actions"><button class="primary" onclick="startPractice()">Comença el repàs →</button><button onclick="selected=cats.map(c=>c[0]);categorySetup()">Selecciona-ho tot</button></div><p id="setupError" role="alert"></p></div>`;$('sub').value=subtype}
function toggleCategory(c,on){selected=on?[...new Set([...selected,c])]:selected.filter(s=>s!==c)}
function examIntro(){$('app').innerHTML=`<div class="panel"><span class="badge">Simulacre · Nivell mitjà</span><h2 style="margin-top:12px">Una prova, vuit preguntes</h2><p>Hi haurà una pregunta de cada bloc del temari, en ordre aleatori. Tots els apartats apareixen dins la seva pregunta.</p><ul><li>Pots anar endavant i enrere i modificar les respostes.</li><li>No veuràs cap correcció fins a clicar <strong>Finalitzar prova</strong>.</li><li>Cada apartat té una pista: consultar-la redueix a la meitat el seu valor.</li><li>La nota final serà un interval de ±0,5, ampliat ±0,1 per cada pista consultada.</li></ul><p class="muted">Resol els passos en paper. El bloc de notes queda guardat, però no es corregeix automàticament.</p><button class="primary" onclick="startExam()">Comença una prova nova →</button></div>`}
function startExam(){reset();mode='exam';let varied=shuffle(['mono','poly','identity','value']),levels={[varied[0]]:0,[varied[1]]:2};questions=shuffle(cats.map(([c])=>generators[c](levels[c]??1)));questions.find(q=>q.cat==='value').fields[0].weight=.5;save();render();window.scrollTo(0,0)}
function startPractice(){if(!selected.length){$('setupError').textContent='Selecciona almenys una categoria.';return}reset();mode='practice';nextPractice()}
function nextPractice(){let q;if(pendingReview.length){q=JSON.parse(JSON.stringify(pendingReview.shift()));if(q.cat==='ruffini')q=ruffiniPractice(difficulty);else q.fields.forEach(f=>f.id='f'+(++serial))}else{let cat=pick(selected);q=cat==='poly'?polyOps(difficulty,subtype):cat==='ruffini'?ruffiniPractice(difficulty):generators[cat](difficulty);if(cat==='value'){let kind=nextValueKind();q.fields=[q.fields[kind]];q.title=kind===0?'Valor numèric':'Conceptes teòrics';if(kind===1)q.intro='Tria la resposta correcta.'}else if(q.fields.length>1&&cat!=='ruffini')q.fields=[pick(q.fields)]}questions=[q];index=0;answers={};hints={};notes={};practiceChecked=false;render();window.scrollTo(0,0)}
function hint(id){let f=questions.flatMap(q=>q.fields).find(f=>f.id===id);if(hints[id])return;let text=mode==='exam'?`<h2>Vols consultar la pista?</h2><p>El valor d’aquest apartat es dividirà entre 2 i el marge de la nota final s’ampliarà ±0,1. Tornar a obrir aquesta mateixa pista no penalitza més.</p>`:'<h2>Una pista per començar</h2><p>Et donarà una orientació per resoldre l’apartat.</p>';ask(text,()=>{hints[id]=true;save();render()})}
function setAnswer(id,value){answers[id]=value;save();updateProgress();updatePreview(id)}
function insert(id,text){let input=$(id);let s=input.selectionStart??input.value.length,e=input.selectionEnd??s;input.value=input.value.slice(0,s)+text+input.value.slice(e);setAnswer(id,input.value);input.focus();input.setSelectionRange(s+text.length,s+text.length)}
function inputHTML(f,review){let val=answers[f.id]||'';if(f.type==='choice')return `<select class="answer" id="${f.id}" aria-label="${escapeHTML(f.label)}" ${review?'disabled':''} onchange="setAnswer('${f.id}',this.value)"><option value="">Tria una resposta…</option>${f.options.map(o=>`<option value="${escapeHTML(o)}" ${val===o?'selected':''}>${escapeHTML(o)}</option>`).join('')}</select>`;return `<input class="answer" id="${f.id}" aria-label="${escapeHTML(f.label)}" value="${escapeHTML(val)}" placeholder="Escriu la resposta" ${review?'readonly':''} autocomplete="off" spellcheck="false" oninput="setAnswer('${f.id}',this.value)"><div class="answer-preview" id="preview-${f.id}" aria-label="Previsualització de la resposta">${val?mathHTML(val):'<span class="muted tiny">La teva resposta es visualitzarà aquí.</span>'}</div>${review?'':`<div class="keys" aria-label="Teclat matemàtic">${[['x²','^2'],['x³','^3'],['xⁿ','^'],['( )','()'],['a/b','/'],['·','*'],['−','-']].map(([l,t])=>`<button onclick="insert('${f.id}','${t}')">${l}</button>`).join('')}</div>`}`}
function render(){let q=questions[index],review=mode==='exam'?finished:practiceChecked;if(!q)return landing();if(mode==='practice'&&q.ruffiniGrid)return renderRuffiniPractice(q);$('app').innerHTML=`<div class="sticky"><div class="actions" style="margin:0;justify-content:space-between"><span class="badge">${mode==='exam'?'Mode examen · '+(index+1)+' / 8':'Repàs · '+['Fàcil','Mitjà','Difícil'][difficulty]}</span>${mode==='exam'&&!finished?'<button class="primary" onclick="finalize()">Finalitzar prova</button>':''}${mode==='practice'?'<button onclick="categorySetup()">Canvia categories</button>':''}</div>${mode==='exam'?`<div class="nav">${questions.map((_,i)=>`<button id="nav${i}" class="${i===index?'active':''}" onclick="go(${i})" aria-label="Pregunta ${i+1}">${i+1}</button>`).join('')}</div><div id="answered" class="tiny muted"></div>`:''}</div><div class="panel"><h2>${q.title}</h2><div class="formula">${q.intro.split('<br>').map(fmt).join('<br>')}</div>${!review?'<p class="tiny muted">Pots escriure x^2 o fer servir els botons. S’accepten fraccions i termes en qualsevol ordre.</p>':''}${mode==='exam'&&q.ruffiniData?examRuffiniGridHTML(q,review):''}${(mode==='exam'&&q.ruffiniData?q.fields.slice(q.ruffiniData.cs.length):q.fields).map((f,i)=>`<section class="part"><div class="parthead"><div><strong>${String.fromCharCode((mode==='exam'&&q.ruffiniData?98:97)+i)})</strong> <span class="formula">${fmt(f.label)}</span>${mode==='exam'?`<div class="tiny muted">Valor: ${number(f.weight)}${hints[f.id]?' · Amb pista: '+number(f.weight/2):''}</div>`:''}</div>${!review?`<button onclick="hint('${f.id}')">${hints[f.id]?'Pista consultada':'💡 Pista'}</button>`:''}</div>${hints[f.id]&&!review?`<div class="hint">${escapeHTML(f.hint)}</div>`:''}<div class="field">${inputHTML(f,review)}</div>${review?`<div class="solution"><strong class="${correct(f)?'good':'bad'}">${correct(f)?'Resposta correcta':answers[f.id]?'Revisa aquest apartat':'Apartat sense resposta'}</strong><div class="formula">${fmt(f.expected)}</div><p>${fmt(f.solution)}</p>${!correct(f)&&f.structure?'<p class="tiny">La resposta també ha de tenir la forma demanada: desenvolupada, abreujada o factoritzada.</p>':''}</div>`:''}</section>`).join('')}${!review?`<details><summary>Bloc de notes per al procediment</summary><p class="tiny muted">No es corregeix automàticament. També pots fer-ho en paper.</p><textarea aria-label="Procediment" oninput="notes[${index}]=this.value;save()">${escapeHTML(notes[index]||'')}</textarea></details>`:''}<div class="actions">${mode==='exam'?`<button ${index===0?'disabled':''} onclick="go(${index-1})">← Anterior</button><button ${index===7?'disabled':''} onclick="go(${index+1})">Següent →</button>${finished?'<button class="primary" onclick="results()">Veure el resum</button>':''}`:practiceChecked?'<button class="primary" onclick="nextPractice()">Següent pregunta →</button>':'<button class="primary" onclick="practiceChecked=true;render()">Comprova i mostra el desenvolupament</button>'}</div></div>`;updateProgress()}
function number(n){return (+n.toFixed(2)).toLocaleString('ca-ES',{maximumFractionDigits:2})}
function updateProgress(){if(mode!=='exam')return;let complete=0;questions.forEach((q,i)=>{let count=q.fields.filter(f=>(answers[f.id]||'').trim()).length;if(count===q.fields.length)complete++;let b=$('nav'+i);if(b)b.classList.toggle('filled',count===q.fields.length)});if($('answered'))$('answered').textContent=`${complete} de 8 preguntes amb tots els apartats respostos. Les respostes es guarden automàticament.`}
function go(i){index=Math.max(0,Math.min(7,i));save();render();window.scrollTo(0,0)}
function finalize(){let missing=questions.flatMap(q=>q.fields).filter(f=>!(answers[f.id]||'').trim()).length;ask(`<h2>Finalitzar la prova?</h2><p>${missing?'Tens '+missing+' apartats sense resposta. ':'Has respost tots els apartats. '}Després podràs veure la correcció, però ja no modificar les respostes d’aquesta prova.</p>`,()=>{finished=true;save();results();window.scrollTo(0,0)})}
function grade(){let total=0,score=0,nh=0;for(let q of questions)for(let f of q.fields){total+=f.weight;if(hints[f.id])nh++;if(correct(f))score+=f.weight*(hints[f.id]?.5:1)}let mark=score/total*10,spread=.5+.1*nh;return{score:mark,lo:Math.max(0,mark-spread),hi:Math.min(10,mark+spread),nh,total}}
function results(){let g=grade();$('app').innerHTML=`<div class="panel"><span class="badge">Prova finalitzada</span><h2 style="margin-top:14px">Així ha anat el simulacre</h2><p>La teva nota aproximada estaria entre</p><div class="estimate">${number(g.lo)} i ${number(g.hi)} <span class="tiny">sobre 10</span></div><p class="muted">${g.nh} pistes consultades · Marge ±${number(.5+.1*g.nh)}. El rang queda limitat entre 0 i 10.</p><p class="tiny muted">La correcció automàtica valora les respostes i la forma demanada. A l’examen real també es revisen els passos del procediment; per això aquesta estimació és orientativa.</p><div class="categories">${questions.map((q,i)=>{let ok=q.fields.filter(correct).length;return `<button style="text-align:left" onclick="go(${i})"><strong>${i+1}. ${q.title}</strong><br><span class="muted">${ok} / ${q.fields.length} apartats correctes · Veure correcció →</span></button>`}).join('')}</div><div class="actions"><button class="primary" onclick="reviewErrors()">Practica els apartats que han fallat</button><button onclick="examIntro()">Un altre simulacre</button><button onclick="landing()">Inici</button></div></div>`}
function reviewErrors(){pendingReview=questions.map(q=>({...q,fields:q.fields.filter(f=>!correct(f))})).filter(q=>q.fields.length).flatMap(q=>q.fields.map(f=>({...q,fields:[f]})));if(!pendingReview.length){ask('<h2>Tots els apartats són correctes!</h2><p>Pots continuar amb un repàs nou.</p>',()=>{selected=cats.map(c=>c[0]);startPractice()});return}mode='practice';nextPractice()}
window.Polinomis={parse,equal,calc,correct,validStructure,generators,grade,mathNode,mathHTML,fmt};landing();
</script></html>
